<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure File Portal</title>
  <style>
    :root{
      --bg:#07111d;
      --bg2:#0f1d2e;
      --panel:#121f2f;
      --panel-2:#162a3d;
      --primary:#5eead4;
      --primary-2:#60a5fa;
      --text:#edf6ff;
      --muted:#a8bfd6;
      --border:rgba(255,255,255,.08);
      --danger:#f87171;
      --warning:#fbbf24;
      --success:#22c55e;
      --shadow:0 20px 45px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    button, input, select {
      font: inherit;
    }

    .hidden { display: none !important; }

    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(96,165,250,.14), transparent 30%),
        radial-gradient(circle at bottom right, rgba(94,234,212,.14), transparent 35%);
    }

    .login-box {
      width: min(500px, 100%);
      background: rgba(18,31,47,0.95);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 30px 28px;
    }

    .login-box h1 {
      margin: 0 0 8px;
      letter-spacing: -0.05em;
      font-size: clamp(2rem, 4vw, 2.5rem);
    }

    .subtext {
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    input, select {
      width: 100%;
      background: rgba(255,255,255,.02);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 13px 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: rgba(94,234,212,.7);
      box-shadow: 0 0 0 3px rgba(94,234,212,.15);
    }

    .primary-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px 16px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #06131d;
    }

    .primary-btn:hover {
      filter: brightness(1.04);
    }

    .demo-box {
      margin-top: 20px;
      font-size: 0.86rem;
      color: var(--muted);
      text-align: center;
      background: rgba(255,255,255,.02);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      line-height: 1.6;
    }

    .app-shell {
      min-height: 100vh;
      padding: 24px;
    }

    .topbar {
      max-width: 1180px;
      margin: 0 auto 22px auto;
      background: rgba(18,31,47,0.85);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .brand span { color: var(--primary); }

    .user-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .logout-btn {
      background: rgba(248,113,113,.08);
      color: #fecaca;
      border: 1px solid rgba(248,113,113,.35);
      border-radius: 10px;
      padding: 9px 14px;
      cursor: pointer;
    }

    .main {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      gap: 24px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .stat-card {
      background: rgba(18,31,47,0.8);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 22px 18px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      letter-spacing: -0.06em;
      font-weight: 800;
    }

    .panel {
      background: rgba(18,31,47,0.8);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .panel h2 {
      margin: 0;
      font-size: 1.3rem;
      letter-spacing: -0.04em;
    }

    .upload-form {
      display: grid;
      grid-template-columns: 1.2fr 1.3fr 0.6fr;
      gap: 12px;
      align-items: end;
    }

    .small-btn {
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #04151f;
      border-radius: 10px;
      padding: 12px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .file-list {
      display: grid;
      gap: 12px;
    }

    .file-item {
      display: grid;
      grid-template-columns: 1.9fr 0.8fr 0.7fr auto auto;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      background: rgba(255,255,255,.02);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .file-name {
      font-weight: 700;
      word-break: break-word;
    }

    .file-meta {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .file-role {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(94,234,212,.08);
      color: var(--primary);
      border: 1px solid rgba(94,234,212,.25);
    }

    .download-btn, .delete-btn {
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
      border: 1px solid var(--border);
      font-weight: 600;
    }

    .download-btn {
      background: rgba(96,165,250,.08);
      color: #bfdbfe;
      border-color: rgba(96,165,250,.25);
    }

    .delete-btn {
      background: rgba(248,113,113,.08);
      color: #fecaca;
      border-color: rgba(248,113,113,.25);
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 18px 0;
    }

    @media (max-width: 800px) {
      .upload-form {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .file-item {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div id="loginPage" class="login-page">
    <div class="login-box">
      <h1>Secure Portal</h1>
      <div class="subtext">
        Access files, shared documents, and internal resources.
      </div>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Enter username" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password" />
      </div>

      <button id="loginBtn" class="primary-btn">Log In</button>

      <div class="demo-box">
        Demo accounts:<br />
        admin / admin123<br />
        staff / staff123<br />
        viewer / viewer123
      </div>
    </div>
  </div>

  <div id="appPage" class="app-shell hidden">
    <div class="topbar">
      <div class="brand"><span>File</span> Portal</div>

      <div class="user-actions">
        <div id="userBadge" class="badge">Welcome</div>
        <button id="logoutBtn" class="logout-btn">Log Out</button>
      </div>
    </div>

    <div class="main">
      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">Visible Files</div>
          <div id="visibleFiles" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Role</div>
          <div id="userRole" class="stat-value">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Uploads</div>
          <div id="uploadCount" class="stat-value">0</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2>Upload file</h2>
        </div>

        <form id="uploadForm" class="upload-form">
          <div>
            <label for="fileName">File name</label>
            <input id="fileName" type="text" placeholder="project-plan.txt" required />
          </div>

          <div>
            <label for="fileContent">File content</label>
            <input id="fileContent" type="text" placeholder="Enter text content" required />
          </div>

          <div>
            <label for="fileAccess">Access</label>
            <select id="fileAccess">
              <option value="all">All users</option>
              <option value="staff">Staff only</option>
              <option value="admin">Admin only</option>
            </select>
          </div>

          <button type="submit" class="small-btn" style="grid-column: 1 / -1;">Upload</button>
        </form>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2>Available files</h2>
        </div>

        <div id="fileList" class="file-list"></div>
      </div>
    </div>
  </div>

  <script>
    const USERS = {
      admin: { password: "admin123", role: "admin" },
      staff: { password: "staff123", role: "staff" },
      viewer: { password: "viewer123", role: "viewer" }
    };

    const STORAGE_KEY = "secure_file_portal_demo";

    const seedFiles = [
      { id: 1, name: "welcome-note.txt", content: "Welcome to the secure portal.", access: "all", owner: "admin" },
      { id: 2, name: "team-guide.pdf", content: "This document is for staff and team members.", access: "staff", owner: "admin" },
      { id: 3, name: "confidential-report.pdf", content: "Admin-only report", access: "admin", owner: "admin" }
    ];

    const state = {
      currentUser: null
    };

    const loginPage = document.getElementById("loginPage");
    const appPage = document.getElementById("appPage");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const userBadge = document.getElementById("userBadge");
    const fileList = document.getElementById("fileList");
    const uploadForm = document.getElementById("uploadForm");
    const userRoleEl = document.getElementById("userRole");
    const visibleFilesEl = document.getElementById("visibleFiles");
    const uploadCountEl = document.getElementById("uploadCount");

    function getFiles() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seedFiles));
        return [...seedFiles];
      }

      try {
        return JSON.parse(saved);
      } catch {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seedFiles));
        return [...seedFiles];
      }
    }

    function saveFiles(files) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
    }

    function userCanSeeFile(user, file) {
      const role = user ? USERS[user].role : null;

      if (!user) return false;

      if (role === "admin") return true;

      if (role === "staff") {
        return file.access === "all" || file.access === "staff";
      }

      if (role === "viewer") {
        return file.access === "all";
      }

      return false;
    }

    function canDeleteFile(user, file) {
      if (!user) return false;
      if (USERS[user].role === "admin") return true;
      return file.owner === user;
    }

    function renderFiles() {
      const user = state.currentUser;
      const files = getFiles();
      const visible = files.filter(file => userCanSeeFile(user, file));

      fileList.innerHTML = "";

      if (!visible.length) {
        fileList.innerHTML = '<div class="empty-state">No files available for your role.</div>';
        visibleFilesEl.textContent = "0";
        return;
      }

      visible.forEach(file => {
        const row = document.createElement("div");
        row.className = "file-item";

        const nameDiv = document.createElement("div");
        nameDiv.innerHTML = `
          <div class="file-name">${file.name}</div>
          <div class="file-meta">Owner: ${file.owner}</div>
        `;

        const sizeDiv = document.createElement("div");
        sizeDiv.className = "file-meta";
        sizeDiv.textContent = `${Math.max(10, file.content.length)} KB`;

        const accessBadge = document.createElement("div");
        accessBadge.className = "file-role";
        accessBadge.textContent = file.access;

        const downloadBtn = document.createElement("button");
        downloadBtn.className = "download-btn";
        downloadBtn.textContent = "Download";
        downloadBtn.onclick = () => downloadFile(file);

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "Delete";
        deleteBtn.disabled = !canDeleteFile(user, file);
        deleteBtn.style.opacity = canDeleteFile(user, file) ? "1" : "0.4";
        deleteBtn.onclick = () => deleteFile(file.id);

        row.appendChild(nameDiv);
        row.appendChild(sizeDiv);
        row.appendChild(accessBadge);
        row.appendChild(downloadBtn);
        row.appendChild(deleteBtn);

        fileList.appendChild(row);
      });

      visibleFilesEl.textContent = String(visible.length);
      uploadCountEl.textContent = String(visible.length);
    }

    function downloadFile(file) {
      const blob = new Blob([file.content], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = file.name;
      a.click();
      URL.revokeObjectURL(url);
    }

    function deleteFile(id) {
      const files = getFiles();
      const file = files.find(f => f.id === id);

      if (!file) return;

      if (!canDeleteFile(state.currentUser, file)) {
        alert("You do not have permission to delete this file.");
        return;
      }

      const updated = files.filter(f => f.id !== id);
      saveFiles(updated);
      renderFiles();
    }

    function setLoggedIn(username) {
      state.currentUser = username;
      userBadge.textContent = `Welcome, ${username}`;
      userRoleEl.textContent = USERS[username].role;

      loginPage.classList.add("hidden");
      appPage.classList.remove("hidden");

      renderFiles();
    }

    function logout() {
      state.currentUser = null;
      userBadge.textContent = "Welcome";
      userRoleEl.textContent = "-";
      usernameInput.value = "";
      passwordInput.value = "";

      appPage.classList.add("hidden");
      loginPage.classList.remove("hidden");
    }

    loginBtn.addEventListener("click", () => {
      const username = usernameInput.value.trim().toLowerCase();
      const password = passwordInput.value.trim();

      if (!username || !password) {
        alert("Please enter your username and password.");
        return;
      }

      const user = USERS[username];

      if (!user) {
        alert("Invalid username.");
        return;
      }

      if (user.password !== password) {
        alert("Incorrect password.");
        return;
      }

      setLoggedIn(username);
    });

    logoutBtn.addEventListener("click", logout);

    uploadForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const user = state.currentUser;
      if (!user) {
        alert("Please log in first.");
        return;
      }

      const role = USERS[user].role;

      if (role === "viewer") {
        alert("Viewers cannot upload files.");
        return;
      }

      const name = document.getElementById("fileName").value.trim();
      const content = document.getElementById("fileContent").value.trim();
      const access = document.getElementById("fileAccess").value;

      if (!name || !content) {
        alert("Please provide a file name and content.");
        return;
      }

      if (role === "staff" && access === "admin") {
        alert("Staff cannot upload admin-only files.");
        return;
      }

      const files = getFiles();

      files.unshift({
        id: Date.now(),
        name,
        content,
        access,
        owner: user
      });

      saveFiles(files);
      uploadForm.reset();
      renderFiles();
    });

    renderFiles();
  </script>
</body>
</html>
